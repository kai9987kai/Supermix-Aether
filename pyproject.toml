[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supermix-aether"
version = "0.3.0"
description = "CPU-local NeuroWave-X communication research laboratory"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.setuptools.package-data]
"aether.live" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

